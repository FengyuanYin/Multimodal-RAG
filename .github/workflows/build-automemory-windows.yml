name: Build AutoMemory Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agentic_rag/cli/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-automemory-windows.yml"

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and build dependencies
        run: python -m pip install -e ".[cli,dev]" "pyinstaller>=6.10,<7"
      - name: Test
        run: python -m pytest tests -q
      - name: Build single console executable
        run: python -m PyInstaller --noconfirm --clean packaging/AutoMemory.spec
      - name: Smoke test executable
        shell: pwsh
        run: |
          $version = & .\dist\AutoMemory.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "AutoMemory 0.3.0") { throw "EXE smoke test failed: $version" }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoMemory-windows-x64
          path: dist/AutoMemory.exe
          if-no-files-found: error
          retention-days: 30
