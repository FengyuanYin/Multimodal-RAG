<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Chat · BYOK 私有 RAG</title>
  <meta name="description" content="浏览器本地 PDF 问答工具：上传 PDF，自带 API Key，数据不出浏览器。" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // pdf.js 使用限制（必须设置 workerSrc 才能解析 PDF）
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  </script>
</head>
<body>
  <!-- 背景装饰光斑 -->
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- ── 顶栏 ── -->
  <header class="topbar glass">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="8" y1="13" x2="16" y2="13"/>
            <line x1="8" y1="17" x2="13" y2="17"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>PDF Chat</h1>
          <p>浏览器本地 RAG · BYOK 私有问答</p>
        </div>
      </div>
      <div class="privacy-badge" title="文档解析与检索均在浏览器本地完成">
        <span class="dot"></span> 数据不出浏览器
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- ── 左侧：设置 ── -->
    <aside class="panel settings glass">
      <div class="panel-head">
        <span class="panel-icon">⚙️</span>
        <h2>LLM 设置</h2>
      </div>
      <p class="hint">密钥仅保存在本浏览器（localStorage），仅发送到你填写的 API 地址。</p>

      <div class="field">
        <label for="apiKey">API Key <span class="req">*</span></label>
        <div class="key-row">
          <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
          <button id="toggleKey" type="button" title="显示/隐藏" class="icon-btn">👁</button>
        </div>
      </div>

      <div class="field">
        <label for="callMode">API 调用方式</label>
        <select id="callMode">
          <option value="direct">直连（需提供商支持 CORS）</option>
          <option value="proxy">同源代理（自托管 web/proxy.py）</option>
        </select>
      </div>

      <div class="field">
        <label for="baseUrl">Base URL（OpenAI 兼容）</label>
        <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1" />
      </div>

      <div class="field">
        <label for="model">模型</label>
        <input type="text" id="model" placeholder="gpt-4o-mini" />
      </div>

      <div class="field">
        <label for="embedModel">Embedding 模型（可选）</label>
        <input type="text" id="embedModel" placeholder="留空则仅用关键词检索" />
      </div>

      <div class="row2">
        <div class="field">
          <label for="topK">检索块数</label>
          <input type="number" id="topK" min="1" max="20" value="5" />
        </div>
        <div class="field">
          <label for="chunkSize">分块字符数</label>
          <input type="number" id="chunkSize" min="100" max="4000" value="800" />
        </div>
      </div>

      <div class="settings-actions">
        <button id="saveSettings" class="btn primary">保存设置</button>
        <button id="clearData" class="btn ghost">清除本地数据</button>
      </div>
    </aside>

    <!-- ── 中间：文档 ── -->
    <section class="panel docs glass">
      <div class="panel-head">
        <span class="panel-icon">📚</span>
        <h2>文档</h2>
      </div>

      <div id="dropZone" class="dropzone" role="button" tabindex="0" aria-label="上传 PDF">
        <div class="dz-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="dz-title">点击或拖拽 PDF 到此处</p>
        <p class="dz-sub">多文件支持 · 本地解析 · 不经过任何服务器</p>
        <input type="file" id="fileInput" accept="application/pdf" multiple hidden />
      </div>

      <div class="doc-stats" id="docStats">未加载文档</div>
      <ul id="docList" class="doc-list"></ul>

      <button id="buildIndex" class="btn primary btn-lg" disabled>
        <span class="btn-label">建立索引</span>
      </button>
      <div class="progress hidden" id="progress"><div class="bar" id="progressBar"></div></div>
    </section>

    <!-- ── 右侧：对话 ── -->
    <section class="panel chat glass">
      <div class="panel-head">
        <span class="panel-icon">💬</span>
        <h2>对话</h2>
        <span class="model-tag" id="modelTag">未配置</span>
      </div>

      <div id="messages" class="messages">
        <div class="msg system">👋 上传 PDF 并建立索引后，即可基于文档提问。</div>
      </div>

      <form id="chatForm" class="chat-form">
        <div class="input-wrap">
          <textarea id="question" rows="2" placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button type="submit" class="btn primary send-btn" id="askBtn" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    开源示例 · API Key 仅发送到你配置的 API 地址 · 文档与索引全部保留在浏览器本地
  </footer>

  <script src="app.js"></script>
</body>
</html>
